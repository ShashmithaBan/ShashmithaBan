<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Shashmitha Bandara — DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.55" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#1a1206"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffd28a"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#F59E0B" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- drifting glow blobs -->
  <circle cx="220" cy="120" r="150" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="cx" values="220;380;220" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;180;120" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="220" r="170" fill="url(#glow)" filter="url(#soft)" opacity="0.8">
    <animate attributeName="cx" values="1000;860;1000" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;150;220" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal prompt -->
  <text x="600" y="96" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',monospace" font-size="19" fill="#F59E0B" letter-spacing="2">
    <tspan fill="#4c566a">shashmitha@devops</tspan><tspan fill="#5f6a7a">:~$ </tspan>whoami
  </text>

  <!-- name -->
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="2">
    SHASHMITHA BANDARA
  </text>

  <!-- role line with blinking cursor -->
  <text x="586" y="224" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',monospace" font-size="21" fill="#c9d1d9" letter-spacing="3">
    DevOps  ·  Cloud  ·  Automation  ·  IaC
  </text>
  <rect x="812" y="208" width="13" height="22" fill="#F59E0B">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- animated accent line -->
  <rect x="360" y="256" width="480" height="2.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- moving scan dot along the line -->
  <circle cy="257" r="4" fill="#ffffff">
    <animate attributeName="cx" values="360;840;360" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
